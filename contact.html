<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Contact — Finn Jones</title>
    <meta name="description" content="Get in touch with Finn Jones — Associate Software Engineer at Lendi Group." />
    <meta content="Contact Finn Jones" property="og:title" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link href="css/webflow-style.css" rel="stylesheet" type="text/css" />
    <link href="css/custom.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="images/favicon.png" rel="shortcut icon" type="image/x-icon" />
    <link href="images/app-icon.png" rel="apple-touch-icon" />
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar-custom" id="navbar">
        <a href="/" class="nav-brand" aria-label="Home">
            <span class="brand-text">finnjones.me</span>
        </a>
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/about" class="nav-link">About</a>
            <a href="/contact" class="nav-link active">Contact</a>
        </div>
    </nav>

    <!-- Page Hero -->
    <section class="page-hero">
        <h1 class="page-hero-title anim-slide-up">Contact.</h1>
    </section>

    <!-- Contact Form -->
    <section class="contact-section">
        <div class="contact-wrapper reveal">
            <div class="contact-info">
                <h2 class="contact-heading">Get in touch.</h2>
                <p class="contact-subtext">Have a project in mind, or just want to say hello? I'd love to hear from you. Fill out the form and I'll get back to you soon.</p>
                <div class="contact-social-links">
                    <a href="https://www.linkedin.com/in/finn-jones/" class="contact-social" target="_blank" rel="noopener">LinkedIn →</a>
                    <a href="https://github.com/finnjones" class="contact-social" target="_blank" rel="noopener">GitHub →</a>
                </div>
            </div>
            <div class="contact-form-wrapper">
                <form id="contact-form" name="contact-form" class="contact-form" method="get">
                    <div class="form-group">
                        <label for="name" class="form-label">Name</label>
                        <input class="form-input" maxlength="256" name="name" placeholder="Your Name" type="text" id="name" required />
                    </div>
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input class="form-input" maxlength="256" name="email" placeholder="your@email.com" type="email" id="email" required />
                    </div>
                    <div class="form-group">
                        <label for="message" class="form-label">Message</label>
                        <textarea id="message" name="message" placeholder="Tell me about your project..." maxlength="5000" class="form-input form-textarea" required></textarea>
                    </div>
                    <button type="submit" class="form-button">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer-section">
        <div class="footer-content">
            <span class="brand-text">finnjones.me</span>
            <div class="footer-links-row">
                <a href="https://www.linkedin.com/in/finn-jones/" class="footer-link" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://github.com/finnjones" class="footer-link" target="_blank" rel="noopener">GitHub</a>
            </div>
            <p class="footer-copy">© 2026 Finn Jones. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/animations.js"></script>
</body>

</html>
