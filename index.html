<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Finn Jones — Software Engineer</title>
    <meta name="description" content="Portfolio of Finn Jones — Associate Software Engineer at Lendi Group, building modern web and software solutions." />
    <meta content="Finn Jones — Software Engineer" property="og:title" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet" type="text/css" />
    <link href="images/favicon.png" rel="shortcut icon" type="image/x-icon" />
    <link href="images/app-icon.png" rel="apple-touch-icon" />
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="nav-brand" aria-label="Home">finnjones.me</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link active">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header class="hero">
        <div class="hero-inner">
            <span class="mono-label hero-eyebrow anim-fade-up">// software engineer — sydney</span>
            <h1 class="hero-name anim-fade-up anim-delay-1">Finn Jones<span class="accent">.</span></h1>
            <p class="hero-sub anim-fade-up anim-delay-2" data-slot="headline"></p>
            <div class="hero-ctas anim-fade-up anim-delay-3">
                <a href="#work" class="btn btn-solid">View work</a>
                <a href="contact.html" class="btn">Get in touch</a>
            </div>
        </div>
    </header>

    <!-- Selected work -->
    <section class="section" id="work">
        <div class="section-head reveal">
            <span class="mono-label section-index">01 / selected work</span>
            <h2 class="section-title">Projects<span class="accent">.</span></h2>
        </div>
        <div class="projects" data-slot="projects"></div>
    </section>

    <!-- Currently -->
    <section class="section">
        <div class="currently reveal">
            <div class="currently-panel">
                <div>
                    <span class="mono-label section-index">02 / currently</span>
                    <p class="currently-text" data-slot="currently"></p>
                </div>
                <a href="about.html" class="currently-link">More about me →</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-inner">
            <span class="footer-brand">finnjones.me</span>
            <div class="footer-links" data-slot="socials"></div>
            <p class="footer-copy">© 2026 Finn Jones. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/render.js" defer></script>
</body>

</html>
